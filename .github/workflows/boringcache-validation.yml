name: BoringCache validation
run-name: ${{ inputs.connect && 'WaveHouse OIDC connection' || format('WaveHouse cold and warm at {0}', github.sha) }}
on:
  workflow_dispatch:
    inputs:
      connect:
        description: Connect this validation branch to BoringCache through browser approval
        required: false
        default: false
        type: boolean
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        required: false
        default: ""
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: wavehouse-boringcache-validation
  cancel-in-progress: false
jobs:
  connect:
    name: Connect WaveHouse OIDC
    if: inputs.connect && github.repository == 'boringcache/WaveHouse' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install the released BoringCache CLI
        run: |
          curl -fsSL https://install.boringcache.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Request browser approval for this GitHub workload
        run: boringcache ci connect --oidc-provider github-actions
  cold:
    name: ${{ matrix.provider }} ${{ matrix.cache-case }} cold
    if: ${{ !inputs.connect }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [GitHub, BoringCache]
        cache-case: [unit, modules]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/boringcache-validation
        with:
          provider: ${{ matrix.provider }}
          cache-case: ${{ matrix.cache-case }}
          phase: cold
          cli-version: ${{ inputs.cli_version }}
  warm:
    name: ${{ matrix.provider }} ${{ matrix.cache-case }} warm
    if: ${{ !inputs.connect }}
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [GitHub, BoringCache]
        cache-case: [unit, modules]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/boringcache-validation
        with:
          provider: ${{ matrix.provider }}
          cache-case: ${{ matrix.cache-case }}
          phase: warm
          cli-version: ${{ inputs.cli_version }}
